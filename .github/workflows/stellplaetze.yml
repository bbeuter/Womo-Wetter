# Aktualisiert einmal pro Woche die Wohnmobil-Stellplätze aus OpenStreetMap.
name: Stellplätze aktualisieren

on:
  schedule:
    - cron: "41 2 * * 1"   # montags früh
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: womo-core

      - name: Overpass abfragen
        run: |
          cargo run --release --manifest-path womo-core/Cargo.toml -- \
            stellplaetze --regions data/regions.geojson --out data/stellplaetze.json

      - name: Änderungen committen
        run: |
          if git diff --quiet -- data/stellplaetze.json && git ls-files --error-unmatch data/stellplaetze.json >/dev/null 2>&1; then
            echo "Keine Änderungen."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stellplaetze.json
          git commit -m "Stellplätze aktualisiert"
          git push
