[package]
name = "womo-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Womo-Wetter: Sonnen-Übersicht je Region (Open-Meteo → JSON)"
license = "MIT"
publish = false

[lib]
name = "womo_core"
path = "src/lib.rs"

[[bin]]
name = "womo-core"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
clap = { version = "4.6", features = ["derive"] }
geo = { version = "0.33", default-features = false }
geojson = "1.0"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls", "gzip", "system-proxy", "form"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
